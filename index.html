<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased transition-colors duration-200 selection:bg-brand-600 selection:text-white">

  <!-- ==================== PENGIRA TUKARAN KRW <-> RM ==================== -->

        <!-- Ikon Tukar -->

        <!-- Input RM -->

      <!-- Butang Preset Pantas -->

        <span class="text-xs text-slate-500 dark:text-slate-400 mr-1">Pantas:</span>
        <button type="button" data-krw-preset="1000" class="preset-krw px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 hover:bg-brand-600 hover:text-white dark:bg-slate-800 dark:hover:bg-brand-500 transition">₩1,000</button>

        <button type="button" data-krw-preset="100000" class="preset-krw px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 hover:bg-brand-600 hover:text-white dark:bg-slate-800 dark:hover:bg-brand-500 transition">₩100,000</button>

  <!-- ==================== NAVIGATION TABS ==================== -->

    class="fixed right-5 bottom-5 z-20 flex items-center gap-2 bg-brand-600 hover:bg-brand-700 dark:bg-brand-500 dark:hover:bg-brand-600 text-white font-semibold px-5 py-3.5 rounded-full shadow-lg shadow-brand-600/30 active:scale-95 transition">

  <!-- Hidden textarea untuk fallback salin papan keratan (clipboard) -->
  <textarea id="clipboard-helper" class="sr-only" aria-hidden="true"></textarea>

  <script>
    /**
     * ============================================================================
     * KOREA TRIP PLANNER — APLIKASI WEB INTERAKTIF LENGKAP
     * Data disimpan secara automatik ke localStorage pelayar & menyokong eksport/import.
     * ============================================================================
     */

    const STORAGE_KEY = 'korea_trip_planner_v1';
    const THEME_KEY = 'korea_trip_theme';

    const TABS = [
      { id: 'Checklist', label: '✅ Checklist' },
      { id: 'Itinerary', label: '🗓️ Itinerary' },
      { id: 'Ahli', label: '👥 Ahli' },
      { id: 'Tetapan', label: '⚙️ Tetapan' }
    ];

    const PHASES = ['Before', 'During', 'After'];
    const STATUS_OPTIONS = ['Belum', 'Dalam proses', 'Siap'];
    const YN_OPTIONS = ['Belum', 'Dah'];

    // Data permulaan tepat seperti dalam Google Sheet pengguna
    function getDefaultData() {
      const members = [
        { id: 'm1', nama: 'Hasif', telefon: '', noPasport: '', tarikhLuput: '', waris: '', noWaris: '', alahan: '' },
        { id: 'm2', nama: 'Aiman', telefon: '', noPasport: '', tarikhLuput: '', waris: '', noWaris: '', alahan: '' },
        { id: 'm3', nama: 'Ina', telefon: '', noPasport: '', tarikhLuput: '', waris: '', noWaris: '', alahan: '' },
        { id: 'm4', nama: 'Atika', telefon: '', noPasport: '', tarikhLuput: '', waris: '', noWaris: '', alahan: '' },
        { id: 'm5', nama: 'Fifie', telefon: '', noPasport: '', tarikhLuput: '', waris: '', noWaris: '', alahan: '' },
        { id: 'm6', nama: 'Shikkin', telefon: '', noPasport: '', tarikhLuput: '', waris: '', noWaris: '', alahan: '' }
      ];

      const makeStatusMap = () => ({
        Hasif: 'Belum',
        Aiman: 'Belum',
        Ina: 'Belum',
        Atika: 'Belum',
        Fifie: 'Belum',
        Shikkin: 'Belum'
      });

      return {
        settings: {
          kadar: 0.003063,
          tarikhBerlepas: '',
          tarikhBalik: '',
          penerbangan: '',
          penginapan: '',
          alamatHangul: ''
        },
        members,
        checklist: [
          {
            id: 'c1',
            fasa: 'Before',
            kategori: 'Pengangkutan',
            item: 'Tiket penerbangan',
            anggaran: 2000.00,
            statusAhli: makeStatusMap(),
            nota: 'Anggaran RM2k'
          },
          {
            id: 'c2',
            fasa: 'Before',
            kategori: 'Penginapan',
            item: 'Rumah / penginapan',
            anggaran: 1000.00,
            statusAhli: makeStatusMap(),
            nota: 'Maksimum RM1k seorang'
          },
          {
            id: 'c3',
            fasa: 'Before',
            kategori: 'Kerja',
            item: 'Cuti',
            anggaran: 0,
            statusAhli: makeStatusMap(),
            nota: '9–10 hari'
          },
          {
            id: 'c4',
            fasa: 'Before',
            kategori: 'Dokumen',
            item: 'Buat / renew pasport',
            anggaran: 200.00,
            statusAhli: makeStatusMap(),
            nota: '5 tahun RM200 / 10 tahun RM350'
          },
          {
            id: 'c5',
            fasa: 'Before',
            kategori: 'Komunikasi',
            item: 'Simcard / eSIM / roaming',
            anggaran: 0,
            statusAhli: makeStatusMap(),
            nota: 'Belum tentukan pilihan'
          },
          {
            id: 'c6',
            fasa: 'Before',
            kategori: 'Insurans',
            item: 'Travel insurance',
            anggaran: 42.75,
            statusAhli: makeStatusMap(),
            nota: 'Etiqa RM42.75 / Tune RM54'
          },
          {
            id: 'c7',
            fasa: 'Before',
            kategori: 'Dokumen',
            item: 'K-ETA',
            anggaran: 30.63,
            statusAhli: makeStatusMap(),
            nota: '10,000 won. Anggaran RM auto ikut kadar semasa'
          }
        ],
        itinerary: [
          {
            id: 'i1',
            hari: 1,
            tarikh: '',
            masa: '08:30',
            aktiviti: 'Ketibaan di Incheon & naik AREX Express ke Seoul Station',
            lokasi: 'Incheon International Airport Terminal 1',
            bandar: 'Incheon / Seoul',
            pengangkutan: 'AREX Express Train',
            anggaranKrw: 11000,
            tempahan: '',
            status: 'Belum',
            nota: 'Beli kad T-Money di kedai serbaneka (CU / GS25) & topup ₩20,000'
          },
          {
            id: 'i2',
            hari: 1,
            tarikh: '',
            masa: '14:00',
            aktiviti: 'Check-in Penginapan & Rehat Sebentar',
            lokasi: 'Myeongdong',
            bandar: 'Seoul',
            pengangkutan: 'Subway Line 4',
            anggaranKrw: 0,
            tempahan: '',
            status: 'Belum',
            nota: 'Simpan beg jika sampai awal sebelum waktu check-in'
          },
          {
            id: 'i3',
            hari: 1,
            tarikh: '',
            masa: '18:30',
            aktiviti: 'Jalan-jalan Malam & Street Food Halal / Mesra Muslim',
            lokasi: 'Myeongdong Night Market',
            bandar: 'Seoul',
            pengangkutan: 'Jalan kaki',
            anggaranKrw: 25000,
            tempahan: '',
            status: 'Belum',
            nota: 'Tukar duit tambahan di pengurup wang berhampiran Kedutaan China'
          }
        ]
      };
    }

    // Keadaan Aplikasi (Application State)
    const state = {
      data: loadState(),
      activeTab: 'Checklist',
      activePhase: 'Before',
      showConverter: true
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.settings && Array.isArray(parsed.members)) {
            return parsed;
          }
        }
      } catch (e) {
        console.warn('Gagal membaca localStorage, menggunakan data asal:', e);
      }
      return getDefaultData();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      } catch (e) {
        showToast('Amaran: Gagal menyimpan ke storan pelayar');
      }
    }

    // ==================== HELPER FUNCTIONS ====================
    const $ = (sel) => document.querySelector(sel);
    const esc = (str) => String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    const linkify = (str) => esc(str).replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer" class="underline text-brand-600 dark:text-brand-400 hover:opacity-80 font-medium">Buka Pautan ↗</a>'
    );

    const fmtMoney = (val) => {
      const n = Number(val);
      if (isNaN(n)) return esc(val);
      return n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const fmtInt = (val) => {
      const n = Number(val);
      if (isNaN(n)) return esc(val);
      return Math.round(n).toLocaleString('en-MY');
    };

    const uid = (prefix = 'id') => `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;

    function showToast(message) {
      const box = $('#toast-box');
      const msg = $('#toast-msg');
      msg.textContent = message;
      box.classList.remove('opacity-0', 'translate-y-2');
      box.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.classList.remove('opacity-100', 'translate-y-0');
        box.classList.add('opacity-0', 'translate-y-2');
      }, 2200);
    }

    function copyTextToClipboard(text, successLabel = 'Berjaya disalin!') {
      if (!text) return;
      const helper = $('#clipboard-helper');
      helper.value = text;
      helper.classList.remove('sr-only');
      helper.select();
      helper.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        showToast(successLabel);
      } catch (err) {
        showToast('Tidak dapat menyalin secara automatik');
      }
      helper.classList.add('sr-only');
    }

    // Parse ISO YYYY-MM-DD ke objek Date tempatan
    function parseISODate(isoStr) {
      if (!isoStr) return null;
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoStr.trim());
      if (!m) return null;
      return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    }

    function formatDisplayDate(isoStr) {
      const d = parseISODate(isoStr);
      if (!d) return '';
      return d.toLocaleDateString('ms-MY', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    // Semakan status tarikh luput pasport
    function getPassportStatus(tarikhLuputIso) {
      const exp = parseISODate(tarikhLuputIso);
      if (!exp) return { code: 'empty', html: '<span class="text-xs text-slate-400">Belum diisi</span>' };

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const ret = parseISODate(state.data.settings.tarikhBalik) || parseISODate(state.data.settings.tarikhBerlepas) || today;
      const sixMonthsAfter = new Date(ret.getFullYear(), ret.getMonth() + 6, ret.getDate());

      if (exp < today) {
        return {
          code: 'bad',
          html: '<span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 border border-red-200 dark:border-red-800">⚠️ Dah Luput</span>'
        };
      }
      if (exp < sixMonthsAfter) {
        return {
          code: 'bad',
          html: '<span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border border-amber-200 dark:border-amber-800">⚠️ Kurang 6 Bulan</span>'
        };
      }
      return {
        code: 'good',
        html: '<span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">✅ Sah</span>'
      };
    }

    function getPassportWarnings() {
      return state.data.members
        .filter((m) => getPassportStatus(m.tarikhLuput).code === 'bad')
        .map((m) => m.nama);
    }

    // ==================== THEME MANAGEMENT ====================
    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = saved ? saved === 'dark' : prefersDark;
      document.documentElement.classList.toggle('dark', isDark);
      $('#theme-icon').textContent = isDark ? '☀️' : '🌙';
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      $('#theme-icon').textContent = isDark ? '☀️' : '🌙';
    }

    // ==================== CURRENCY CONVERTER ====================
    function syncConverterFromKrw() {
      const rate = Number(state.data.settings.kadar) || 0.003063;
      const krw = parseFloat($('#inp-krw').value);
      if (isNaN(krw)) {
        $('#inp-rm').value = '';
        return;
      }
      $('#inp-rm').value = (krw * rate).toFixed(2);
    }

    function syncConverterFromRm() {
      const rate = Number(state.data.settings.kadar) || 0.003063;
      const rm = parseFloat($('#inp-rm').value);
      if (isNaN(rm) || rate <= 0) {
        $('#inp-krw').value = '';
        return;
      }
      $('#inp-krw').value = Math.round(rm / rate);
    }

    function updateConverterRateLabel() {
      const rate = Number(state.data.settings.kadar) || 0.003063;
      $('#conv-rate-label').textContent = `1 KRW = ${rate} RM`;
      syncConverterFromKrw();
    }

    // ==================== RENDER: SUMMARY BANNER ====================
    function renderSummaryBanner() {
      const s = state.data.settings;
      const dep = parseISODate(s.tarikhBerlepas);
      const ret = parseISODate(s.tarikhBalik);
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let countdownHtml = '';
      if (dep) {
        const diffDays = Math.round((dep - today) / 86400000);
        let badgeText = '';
        if (diffDays > 0) badgeText = `🛫 ${diffDays} hari lagi`;
        else if (diffDays === 0) badgeText = '🛫 Hari ini berlepas!';
        else if (ret && today > ret) badgeText = '🎉 Trip dah selesai';
        else badgeText = '✈️ Sedang bercuti di Korea!';

        const dateRange = ret
          ? `${formatDisplayDate(s.tarikhBerlepas)} – ${formatDisplayDate(s.tarikhBalik)}`
          : formatDisplayDate(s.tarikhBerlepas);

        countdownHtml = `
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-base sm:text-lg font-extrabold bg-white text-brand-700 px-3 py-1 rounded-xl shadow-sm">${badgeText}</span>
            <span class="text-xs sm:text-sm text-white/90 font-medium">📅 ${esc(dateRange)}</span>
          </div>
        `;
      } else {
        countdownHtml = `
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-xs sm:text-sm font-medium text-white/90">📅 Tarikh berlepas belum ditetapkan</span>
            <button type="button" onclick="switchTab('Tetapan')" class="text-xs font-semibold underline hover:text-white">
              Tetapkan di ⚙️ Tetapan →
            </button>
          </div>
        `;
      }

      const rate = Number(s.kadar) || 0.003063;
      const tenK = (rate * 10000).toFixed(2);

      let extraRows = '';
      if (s.penerbangan) {
        extraRows += `<div class="text-xs sm:text-sm text-white/95"><span class="text-white/70 font-medium">✈️ Penerbangan:</span> ${esc(s.penerbangan)}</div>`;

      if (s.penginapan) {
        extraRows += `<div class="text-xs sm:text-sm text-white/95"><span class="text-white/70 font-medium">🏨 Penginapan:</span> ${esc(s.penginapan)}</div>`;
      }
      if (s.alamatHangul) {
        extraRows += `
          <div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 mt-1.5 border-t border-white/15">
            <div class="text-xs sm:text-sm text-white">
              <span class="text-white/70 font-medium">🇰🇷 Alamat Hangul:</span>
              <span class="font-semibold ml-1">${esc(s.alamatHangul)}</span>

            <div class="flex items-center gap-1.5">
              <button type="button" id="btn-copy-hangul"
                class="text-xs font-semibold bg-white text-brand-700 hover:bg-slate-100 px-2.5 py-1.5 rounded-lg shadow-sm active:scale-95 transition">
                📋 Salin Alamat Hangul
              </button>
              <button type="button" id="btn-show-taxi"
                class="text-xs font-semibold bg-white/20 hover:bg-white/30 text-white px-2.5 py-1.5 rounded-lg border border-white/25 active:scale-95 transition">
                🚕 Skrin Besar Teksi
              </button>
            </div>
          </div>

      }

      $('#header-badge-members').textContent = `${state.data.members.length} Ahli`;

      $('#trip-summary-banner').innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-3">
          ${countdownHtml}
          <div class="text-xs sm:text-sm bg-black/20 px-3 py-1.5 rounded-xl border border-white/15">
            ₩10,000 ≈ <strong class="font-bold text-amber-200">RM ${tenK}</strong>
          </div>
        </div>
        ${extraRows ? `<div class="mt-3 space-y-1.5">${extraRows}</div>` : ''}
      `;

      const copyBtn = $('#btn-copy-hangul');
      if (copyBtn) {
        copyBtn.onclick = () => copyTextToClipboard(s.alamatHangul, 'Alamat Hangul disalin untuk pemandu teksi! 🚕');
      }
      const taxiBtn = $('#btn-show-taxi');
      if (taxiBtn) {
        taxiBtn.onclick = () => openTaxiCardModal(s.alamatHangul, s.penginapan);

    // ==================== RENDER: NAVIGATION TABS ====================
    function renderTabs() {
      $('#nav-tabs').innerHTML = TABS.map((t) => {
        const active = t.id === state.activeTab;
        return `
          <button type="button" data-tab-id="${t.id}"
            class="px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition active:scale-95 ${
              active
                ? 'bg-brand-600 text-white dark:bg-brand-500 shadow-sm'
                : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800'
            }">
            ${t.label}
          </button>
        `;
      }).join('');

      // Kawal butang FAB mengikut tab
      const fab = $('#fab-add');
      if (state.activeTab === 'Tetapan') {
        fab.classList.add('hidden');
      } else {
        fab.classList.remove('hidden');
        const labelMap = {
          Checklist: 'Tambah Item',
          Itinerary: 'Tambah Aktiviti',
          Ahli: 'Tambah Ahli'
        };
        $('#fab-label').textContent = labelMap[state.activeTab] || 'Tambah';
      }
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      renderAll();
    }

    // ==================== RENDER: PASSPORT WARNING BANNER ====================
    function renderPassportAlert() {
      const warnings = getPassportWarnings();
      if (!warnings.length) return '';
      return `
        <div class="mb-4 flex items-start gap-3 bg-red-50 dark:bg-red-950/60 border border-red-200 dark:border-red-800/80 text-red-800 dark:text-red-200 rounded-2xl p-3.5 text-xs sm:text-sm animate-in">
          <span class="text-lg leading-none mt-0.5">⚠️</span>
          <div>
            <p class="font-bold">Semakan Pasport Diperlukan: ${warnings.map(esc).join(', ')}</p>
            <p class="text-red-700/90 dark:text-red-300/90 mt-0.5">Pasport disyorkan sah sekurang-kurangnya 6 bulan selepas tarikh balik dari Korea Selatan.</p>
          </div>
        </div>
      `;
    }

    // ==================== RENDER: TAB 1 — CHECKLIST ====================
    function renderChecklistTab() {
      const members = state.data.members;
      const items = state.data.checklist;

      // Pil penapis fasa (Before, During, After)
      const phasePills = PHASES.map((phase) => {
        const count = items.filter((it) => it.fasa === phase).length;
        const active = phase === state.activePhase;
        return `
          <button type="button" data-phase="${phase}"
            class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${
              active
                ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-sm'
                : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800'
            }">
            ${phase} <span class="ml-1 opacity-75">(${count})</span>
          </button>
        `;
      }).join('');

      const filtered = items.filter((it) => it.fasa === state.activePhase);

      // Kad kemajuan individu setiap ahli
      const progressCards = members.map((m) => {
        const doneCount = filtered.filter((it) => (it.statusAhli?.[m.nama] || 'Belum') === 'Dah').length;
        const total = filtered.length;
        const pct = total ? Math.round((doneCount / total) * 100) : 0;
        return `
          <div class="bg-slate-50 dark:bg-slate-800/70 rounded-xl p-2.5 border border-slate-200/70 dark:border-slate-700/70">
            <div class="flex items-center justify-between text-xs mb-1.5">
              <span class="font-bold text-slate-800 dark:text-slate-100 truncate">${esc(m.nama)}</span>
              <span class="font-semibold text-slate-500 dark:text-slate-400">${doneCount}/${total} (${pct}%)</span>
            </div>
            <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      // Kira jumlah anggaran seorang & kumpulan
      const totalPerPerson = filtered.reduce((acc, it) => acc + (Number(it.anggaran) || 0), 0);
      const totalGroup = totalPerPerson * members.length;

      let tableHtml = '';
      if (!filtered.length) {
        tableHtml = `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-10 text-center">
            <p class="text-slate-500 dark:text-slate-400 text-sm">Belum ada item untuk fasa <strong>${esc(state.activePhase)}</strong>.</p>
            <button type="button" onclick="openChecklistModal()" class="mt-3 px-4 py-2 rounded-xl bg-brand-600 text-white text-xs sm:text-sm font-semibold hover:bg-brand-700 transition">
              + Tambah Item Sekarang
            </button>
          </div>
        `;
      } else {
        const memberHeaders = members.map((m) => `<th class="px-3 py-3 text-center text-xs font-bold uppercase tracking-wider whitespace-nowrap">${esc(m.nama)}</th>`).join('');
        const rowsHtml = filtered.map((it) => {
          const doneNum = members.filter((m) => (it.statusAhli?.[m.nama] || 'Belum') === 'Dah').length;
          const allDone = members.length > 0 && doneNum === members.length;

          const memberCells = members.map((m) => {
            const val = it.statusAhli?.[m.nama] || 'Belum';
            const isDah = val === 'Dah';
            return `
              <td class="px-2.5 py-2.5 text-center whitespace-nowrap">
                <select data-chk-id="${it.id}" data-member="${esc(m.nama)}"
                  class="chk-inline-select text-xs font-semibold rounded-lg px-2 py-1.5 border cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand-500 transition ${
                    isDah
                      ? 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950 dark:text-emerald-300 dark:border-emerald-700'
                      : 'bg-slate-100 text-slate-700 border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700'
                  }">
                  ${YN_OPTIONS.map((opt) => `<option value="${opt}" ${opt === val ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>
              </td>
            `;
          }).join('');

          return `
            <tr class="border-b border-slate-100 dark:border-slate-800/80 hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
              <td class="px-3.5 py-3 whitespace-nowrap">
                <span class="inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-200 border border-brand-100 dark:border-brand-800">
                  ${esc(it.kategori || 'Umum')}
                </span>
              </td>
              <td class="px-3.5 py-3 font-semibold text-slate-900 dark:text-white min-w-[170px]">
                ${esc(it.item)}
              </td>
              <td class="px-3.5 py-3 text-right font-semibold whitespace-nowrap text-slate-700 dark:text-slate-200">
                ${Number(it.anggaran) > 0 ? `RM ${fmtMoney(it.anggaran)}` : '<span class="text-slate-400">–</span>'}
              </td>
              ${memberCells}
              <td class="px-3 py-3 text-center whitespace-nowrap">
                <span class="inline-block text-xs font-bold px-2.5 py-1 rounded-full ${
                  allDone
                    ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300'
                    : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'
                }">
                  ${doneNum}/${members.length}
                </span>
              </td>
              <td class="px-3.5 py-3 text-xs text-slate-600 dark:text-slate-400 min-w-[180px]">
                ${linkify(it.nota || '')}
              </td>
              <td class="px-3.5 py-3 text-right whitespace-nowrap">
                <button type="button" data-edit-chk="${it.id}" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Edit">✏️</button>
                <button type="button" data-del-chk="${it.id}" class="p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-950 transition" title="Padam">🗑️</button>
              </td>
            </tr>
          `;
        }).join('');

        tableHtml = `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto thin-scroll">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="bg-brand-600 dark:bg-slate-800 text-white">
                    <th class="px-3.5 py-3 text-xs font-bold uppercase tracking-wider whitespace-nowrap">Kategori</th>
                    <th class="px-3.5 py-3 text-xs font-bold uppercase tracking-wider whitespace-nowrap">Item</th>
                    <th class="px-3.5 py-3 text-right text-xs font-bold uppercase tracking-wider whitespace-nowrap">Anggaran / org</th>
                    ${memberHeaders}
                    <th class="px-3 py-3 text-center text-xs font-bold uppercase tracking-wider whitespace-nowrap">Siap</th>
                    <th class="px-3.5 py-3 text-xs font-bold uppercase tracking-wider whitespace-nowrap">Nota</th>
                    <th class="px-3.5 py-3 text-right text-xs font-bold uppercase tracking-wider whitespace-nowrap">Tindakan</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      return `
        <div class="animate-in space-y-4">
          ${renderPassportAlert()}

          <!-- Filter Fasa -->
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">${phasePills}</div>
            <span class="text-xs text-slate-500 dark:text-slate-400">Tukar status <strong>Belum / Dah</strong> terus dalam jadual</span>
          </div>

          <!-- Progress Bar Individu 6 Ahli -->
          ${filtered.length ? `
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">
                Kemajuan Persediaan Ahli (${esc(state.activePhase)})
              </h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
                ${progressCards}
              </div>
            </div>
          ` : ''}

          <!-- Jadual Checklist -->
          ${tableHtml}

          <!-- Kad Ringkasan Bajet Checklist -->
          ${filtered.length ? `
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Jumlah Anggaran Fasa ${esc(state.activePhase)} (Seorang)
                </p>
                <p class="text-xl sm:text-2xl font-extrabold text-brand-600 dark:text-brand-400 mt-0.5">
                  RM ${fmtMoney(totalPerPerson)}
                </p>
              </div>
              <div class="sm:text-right border-t sm:border-t-0 pt-2.5 sm:pt-0 border-slate-100 dark:border-slate-800">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Anggaran Keseluruhan Kumpulan (${members.length} Orang)
                </p>
                <p class="text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-100 mt-0.5">
                  RM ${fmtMoney(totalGroup)}
                </p>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ==================== RENDER: TAB 2 — ITINERARY ====================
    function renderItineraryTab() {
      const rate = Number(state.data.settings.kadar) || 0.003063;
      const list = [...state.data.itinerary].sort((a, b) => {
        const ha = a.hari === '' || a.hari === null ? 9999 : Number(a.hari);
        const hb = b.hari === '' || b.hari === null ? 9999 : Number(b.hari);
        return ha - hb || String(a.masa || '').localeCompare(String(b.masa || ''));
      });

      if (!list.length) {
        return `
          <div class="animate-in">
            ${renderPassportAlert()}
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-10 text-center">
              <p class="text-slate-500 dark:text-slate-400 text-sm">Jadual perjalanan (Itinerary) masih kosong.</p>
              <button type="button" onclick="openItineraryModal()" class="mt-3 px-4 py-2 rounded-xl bg-brand-600 text-white text-xs sm:text-sm font-semibold hover:bg-brand-700 transition">
                + Tambah Aktiviti Pertama
              </button>
            </div>
          </div>
        `;
      }

      // Kumpulkan mengikut Hari
      const groups = [];
      list.forEach((item) => {
        const key = item.hari === '' || item.hari === null ? 'Belum Ditetapkan' : String(item.hari);
        let grp = groups.find((g) => g.key === key);
        if (!grp) {
          grp = { key, items: [] };
          groups.push(grp);
        }
        grp.items.push(item);
      });

      const grandKrw = list.reduce((sum, it) => sum + (Number(it.anggaranKrw) || 0), 0);
      const grandRm = grandKrw * rate;

      const dayCardsHtml = groups.map((g) => {
        const dayKrw = g.items.reduce((sum, it) => sum + (Number(it.anggaranKrw) || 0), 0);
        const dayRm = dayKrw * rate;
        const firstDate = g.items.map((it) => it.tarikh).find(Boolean);
        const dayTitle = g.key === 'Belum Ditetapkan' ? 'Hari Belum Ditetapkan' : `Hari ${esc(g.key)}`;

        const rowsHtml = g.items.map((it) => {
          const krw = Number(it.anggaranKrw) || 0;
          const rm = krw * rate;
          const q = encodeURIComponent([it.lokasi, it.bandar, 'Korea'].filter(Boolean).join(' '));
          const stClass =
            it.status === 'Siap'
              ? 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950 dark:text-emerald-300 dark:border-emerald-700'
              : it.status === 'Dalam proses'
              ? 'bg-amber-100 text-amber-800 border-amber-300 dark:bg-amber-950 dark:text-amber-300 dark:border-amber-700'
              : 'bg-slate-100 text-slate-700 border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700';

          return `
            <tr class="border-b border-slate-100 dark:border-slate-800/80 hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
              <td class="px-3.5 py-3 font-bold text-brand-600 dark:text-brand-400 whitespace-nowrap">
                ${esc(it.masa || '–')}
              </td>
              <td class="px-3.5 py-3 min-w-[200px]">
                <div class="font-semibold text-slate-900 dark:text-white">${esc(it.aktiviti)}</div>
                ${it.pengangkutan ? `<div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">🚆 ${esc(it.pengangkutan)}</div>` : ''}
              </td>
              <td class="px-3.5 py-3 min-w-[180px]">
                ${it.lokasi ? `
                  <div class="font-medium text-slate-800 dark:text-slate-200">${esc(it.lokasi)}</div>
                  <div class="flex items-center gap-2 text-xs mt-1">
                    <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener noreferrer"
                      class="inline-flex items-center gap-0.5 text-blue-600 dark:text-blue-400 hover:underline font-medium">
                      📍 Google Maps
                    </a>
                    <span class="text-slate-300 dark:text-slate-700">•</span>
                    <a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener noreferrer"
                      class="inline-flex items-center gap-0.5 text-emerald-600 dark:text-emerald-400 hover:underline font-medium">
                      Naver Map
                    </a>
                  </div>
                ` : '<span class="text-slate-400">–</span>'}
              </td>
              <td class="px-3.5 py-3 text-xs font-medium text-slate-600 dark:text-slate-300 whitespace-nowrap">
                ${esc(it.bandar || '–')}
              </td>
              <td class="px-3.5 py-3 text-right font-semibold whitespace-nowrap text-slate-800 dark:text-slate-200">
                ${krw > 0 ? `₩${fmtInt(krw)}` : '<span class="text-slate-400">–</span>'}
              </td>
              <td class="px-3.5 py-3 text-right font-semibold whitespace-nowrap text-emerald-700 dark:text-emerald-400">
                ${krw > 0 ? `RM ${fmtMoney(rm)}` : '<span class="text-slate-400">–</span>'}
              </td>
              <td class="px-3.5 py-3 text-center whitespace-nowrap">
                <select data-itin-id="${it.id}"
                  class="itin-status-select text-xs font-semibold rounded-lg px-2.5 py-1.5 border cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand-500 ${stClass}">
                  ${STATUS_OPTIONS.map((opt) => `<option value="${opt}" ${opt === (it.status || 'Belum') ? 'selected' : ''}>${opt}</option>`).join('')}
                </select>
              </td>
              <td class="px-3.5 py-3 text-xs text-slate-600 dark:text-slate-400 min-w-[180px]">
                ${it.tempahan ? `<div class="mb-1">${linkify(it.tempahan)}</div>` : ''}
                ${linkify(it.nota || '')}
              </td>
              <td class="px-3.5 py-3 text-right whitespace-nowrap">
                <button type="button" data-edit-itin="${it.id}" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Edit">✏️</button>
                <button type="button" data-del-itin="${it.id}" class="p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-950 transition" title="Padam">🗑️</button>
              </td>
            </tr>
          `;
        }).join('');

        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden">
            <!-- Header Hari -->
            <div class="bg-slate-100/90 dark:bg-slate-800/90 px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <span class="px-3 py-1 rounded-lg bg-brand-600 text-white text-xs sm:text-sm font-bold">${dayTitle}</span>
                ${firstDate ? `<span class="text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300">📅 ${esc(formatDisplayDate(firstDate))}</span>` : ''}
              </div>
              <div class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">
                Jumlah Hari Ini: <span class="text-brand-600 dark:text-brand-400">₩${fmtInt(dayKrw)}</span>
                <span class="text-slate-400 mx-1">≈</span>
                <span class="text-emerald-600 dark:text-emerald-400">RM ${fmtMoney(dayRm)}</span>
              </div>
            </div>

            <div class="overflow-x-auto thin-scroll">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="border-b border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 bg-slate-50/50 dark:bg-slate-900">
                    <th class="px-3.5 py-2.5 text-xs font-bold uppercase tracking-wider">Masa</th>
                    <th class="px-3.5 py-2.5 text-xs font-bold uppercase tracking-wider">Aktiviti</th>
                    <th class="px-3.5 py-2.5 text-xs font-bold uppercase tracking-wider">Lokasi & Peta</th>
                    <th class="px-3.5 py-2.5 text-xs font-bold uppercase tracking-wider">Bandar</th>

        e.preventDefault();
        const statusAhli = {};
        document.querySelectorAll('[data-modal-member]').forEach((sel) => {
          statusAhli[sel.dataset.modalMember] = sel.value;
        });

        const payload = {
          id: existing ? existing.id : uid('c'),
          fasa: $('#m-chk-fasa').value,
          kategori: $('#m-chk-kat').value.trim() || 'Umum',
          item: $('#m-chk-item').value.trim(),
          anggaran: parseFloat($('#m-chk-anggaran').value) || 0,
          statusAhli,
          nota: $('#m-chk-nota').value.trim()

        closeModal();
        renderAll();
        showToast(existing ? 'Item dikemas kini ✔' : 'Item ditambah ✔');

                  <input id="m-it-hari" type="number" min="1" required value="${esc(defaultDay)}"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Tarikh</label>
                  <input id="m-it-tarikh" type="date" value="${esc(existing?.tarikh || '')}"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Masa</label>
                  <input id="m-it-masa" type="time" value="${esc(existing?.masa || '')}"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Aktiviti *</label>
                <input id="m-it-aktiviti" type="text" required value="${esc(existing?.aktiviti || '')}" placeholder="Cth: Lawatan ke Gyeongbokgung Palace & Sewa Hanbok"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Lokasi (Auto Peta Google & Naver)</label>
                  <input id="m-it-lokasi" type="text" value="${esc(existing?.lokasi || '')}" placeholder="Cth: Gyeongbokgung Palace"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Bandar</label>
                  <input id="m-it-bandar" type="text" value="${esc(existing?.bandar || 'Seoul')}" placeholder="Cth: Seoul / Busan / Jeju"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Pengangkutan</label>
                  <input id="m-it-transport" type="text" value="${esc(existing?.pengangkutan || '')}" placeholder="Cth: Subway Line 3"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Anggaran (KRW)</label>
                  <input id="m-it-krw" type="number" step="any" min="0" value="${existing ? existing.anggaranKrw : 0}"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                  <select id="m-it-status" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">
                    ${STATUS_OPTIONS.map((s) => `<option value="${s}" ${(existing?.status || 'Belum') === s ? 'selected' : ''}>${s}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Pautan Tempahan / Tiket (jika ada)</label>
                <input id="m-it-tempahan" type="text" value="${esc(existing?.tempahan || '')}" placeholder="https://..."
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Nota</label>
                <textarea id="m-it-nota" rows="2" placeholder="Tips masa melawat, kedai makan halal berdekatan..."
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">${esc(existing?.nota || '')}</textarea>
              </div>

              <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                <button type="button" id="modal-cancel" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700 transition">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      `;

      $('#modal-cancel').onclick = closeModal;
      $('#modal-backdrop').onclick = (e) => { if (e.target.id === 'modal-backdrop') closeModal(); };
      $('#form-itin-modal').onsubmit = (e) => {
        e.preventDefault();
        const payload = {
          id: existing ? existing.id : uid('i'),
          hari: parseInt($('#m-it-hari').value, 10) || 1,
          tarikh: $('#m-it-tarikh').value,
          masa: $('#m-it-masa').value,
          aktiviti: $('#m-it-aktiviti').value.trim(),
          lokasi: $('#m-it-lokasi').value.trim(),
          bandar: $('#m-it-bandar').value.trim(),
          pengangkutan: $('#m-it-transport').value.trim(),
          anggaranKrw: parseFloat($('#m-it-krw').value) || 0,
          tempahan: $('#m-it-tempahan').value.trim(),
          status: $('#m-it-status').value,
          nota: $('#m-it-nota').value.trim()
        };

        if (existing) {
          const idx = state.data.itinerary.findIndex((x) => x.id === existing.id);
          state.data.itinerary[idx] = payload;
        } else {
          state.data.itinerary.push(payload);
        }
        saveState();
        closeModal();
        renderAll();
        showToast(existing ? 'Aktiviti dikemas kini ✔' : 'Aktiviti ditambah ✔');
      };
    }

    // Modal Tambah / Edit Ahli
    function openMemberModal(editId = null) {
      const existing = editId ? state.data.members.find((x) => x.id === editId) : null;

      $('#modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 animate-in" id="modal-backdrop">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-5 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">
              ${existing ? `✏️ Kemaskini Ahli · ${esc(existing.nama)}` : '➕ Tambah Ahli Baharu'}
            </h3>
            <form id="form-mem-modal" class="space-y-3.5">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Nama *</label>
                  <input id="m-mem-nama" type="text" required value="${esc(existing?.nama || '')}" placeholder="Nama panggilan"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">No. Telefon</label>
                  <input id="m-mem-tel" type="tel" value="${esc(existing?.telefon || '')}" placeholder="01X-XXXXXXX"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">No. Pasport</label>
                  <input id="m-mem-pasport" type="text" value="${esc(existing?.noPasport || '')}" placeholder="A12345678"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm uppercase" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Tarikh Luput Pasport</label>
                  <input id="m-mem-luput" type="date" value="${esc(existing?.tarikhLuput || '')}"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Waris Kecemasan</label>
                  <input id="m-mem-waris" type="text" value="${esc(existing?.waris || '')}" placeholder="Ibu / Ayah / Pasangan"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">No. Telefon Waris</label>
                  <input id="m-mem-nowaris" type="tel" value="${esc(existing?.noWaris || '')}" placeholder="01X-XXXXXXX"
                    class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Alahan / Nota Kesihatan</label>
                <textarea id="m-mem-alahan" rows="2" placeholder="Alahan makanan laut, ubat-ubatan, dsb."
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">${esc(existing?.alahan || '')}</textarea>
              </div>

              <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                <button type="button" id="modal-cancel" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700 transition">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      `;

      $('#modal-cancel').onclick = closeModal;
      $('#modal-backdrop').onclick = (e) => { if (e.target.id === 'modal-backdrop') closeModal(); };
      $('#form-mem-modal').onsubmit = (e) => {
        e.preventDefault();
        const newName = $('#m-mem-nama').value.trim();
        if (!newName) return;

        const oldName = existing?.nama;
        const payload = {
          id: existing ? existing.id : uid('m'),
          nama: newName,
          telefon: $('#m-mem-tel').value.trim(),
          noPasport: $('#m-mem-pasport').value.trim().toUpperCase(),
          tarikhLuput: $('#m-mem-luput').value,
          waris: $('#m-mem-waris').value.trim(),
          noWaris: $('#m-mem-nowaris').value.trim(),
          alahan: $('#m-mem-alahan').value.trim()
        };

        if (existing) {
          const idx = state.data.members.findIndex((x) => x.id === existing.id);
          state.data.members[idx] = payload;
          // Jika nama ahli ditukar, kemas kini kunci dalam statusAhli checklist
          if (oldName && oldName !== newName) {
            state.data.checklist.forEach((chk) => {
              if (chk.statusAhli && Object.prototype.hasOwnProperty.call(chk.statusAhli, oldName)) {
                chk.statusAhli[newName] = chk.statusAhli[oldName];
                delete chk.statusAhli[oldName];
              }
            });
          }
        } else {
          state.data.members.push(payload);
          state.data.checklist.forEach((chk) => {
            if (!chk.statusAhli) chk.statusAhli = {};
            chk.statusAhli[newName] = 'Belum';
          });
        }

        saveState();
        closeModal();
        renderAll();
        showToast(existing ? 'Maklumat ahli dikemas kini ✔' : 'Ahli ditambah ✔');
      };
    }

    // ==================== EXPORT / IMPORT / RESET ====================
    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportJson() {
      const stamp = new Date().toISOString().slice(0, 10);
      downloadFile(`Korea_Trip_Planner_${stamp}.json`, JSON.stringify(state.data, null, 2), 'application/json');
      showToast('Fail sandaran JSON dimuat turun 📤');
    }

    function exportCsv() {
      const members = state.data.members.map((m) => m.nama);
      const rate = Number(state.data.settings.kadar) || 0.003063;
      const csvEsc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;

      const lines = [];
      lines.push('=== CHECKLIST PERSEDIAAN ===');
      lines.push(['Fasa', 'Kategori', 'Item', 'Anggaran / orang (RM)', ...members, 'Nota'].map(csvEsc).join(','));
      state.data.checklist.forEach((c) => {
        lines.push([
          c.fasa,
          c.kategori,
          c.item,
          c.anggaran,
          ...members.map((m) => c.statusAhli?.[m] || 'Belum'),
          c.nota
        ].map(csvEsc).join(','));
      });

      lines.push('');
      lines.push('=== ITINERARY PERJALANAN ===');
      lines.push(['Hari', 'Tarikh', 'Masa', 'Aktiviti', 'Lokasi', 'Bandar', 'Pengangkutan', 'Anggaran (KRW)', 'Setara (RM)', 'Status', 'Tempahan', 'Nota'].map(csvEsc).join(','));
      state.data.itinerary.forEach((it) => {
        const rm = ((Number(it.anggaranKrw) || 0) * rate).toFixed(2);
        lines.push([
          it.hari,
          it.tarikh,
          it.masa,
          it.aktiviti,
          it.lokasi,
          it.bandar,
          it.pengangkutan,
          it.anggaranKrw,
          rm,
          it.status,
          it.tempahan,
          it.nota
        ].map(csvEsc).join(','));
      });

      const stamp = new Date().toISOString().slice(0, 10);
      downloadFile(`Korea_Trip_Planner_${stamp}.csv`, '\uFEFF' + lines.join('\n'), 'text/csv;charset=utf-8;');
      showToast('Fail CSV dimuat turun 📊');
    }

    function handleImportJson(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !parsed.settings || !Array.isArray(parsed.members) || !Array.isArray(parsed.checklist)) {
            throw new Error('Format fail tidak sah');
          }
          state.data = parsed;
          saveState();
          updateConverterRateLabel();
          renderAll();
          showToast('Data berjaya diimport! 📥');
        } catch (err) {
          showToast('Ralat: Fail JSON tidak sah');
        }
      };
      reader.readAsText(file);
    }

    // ==================== MASTER RENDER & EVENT DELEGATION ====================
    function renderMainContent() {
      const container = $('#main-content');
      if (state.activeTab === 'Checklist') container.innerHTML = renderChecklistTab();
      else if (state.activeTab === 'Itinerary') container.innerHTML = renderItineraryTab();
      else if (state.activeTab === 'Ahli') container.innerHTML = renderAhliTab();
      else if (state.activeTab === 'Tetapan') container.innerHTML = renderTetapanTab();
    }

    function renderAll() {
      renderSummaryBanner();
      renderTabs();
      renderMainContent();
    }

    // Pasang pendengar acara (Event Listeners)
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      updateConverterRateLabel();
      renderAll();

      // Tema & Pengira
      $('#btn-theme').onclick = toggleTheme;
      $('#btn-toggle-converter').onclick = () => {
        state.showConverter = !state.showConverter;
        $('#converter-drawer').classList.toggle('hidden', !state.showConverter);
      };

      $('#inp-krw').addEventListener('input', syncConverterFromKrw);
      $('#inp-rm').addEventListener('input', syncConverterFromRm);

      document.querySelectorAll('.preset-krw').forEach((btn) => {
        btn.onclick = () => {
          $('#inp-krw').value = btn.dataset.krwPreset;
          syncConverterFromKrw();
        };
      });

      // Butang FAB (+ Tambah)
      $('#fab-add').onclick = () => {
        if (state.activeTab === 'Checklist') openChecklistModal();
        else if (state.activeTab === 'Itinerary') openItineraryModal();
        else if (state.activeTab === 'Ahli') openMemberModal();
      };

      // Delegasi Klik pada Navigasi & Main Content
      document.addEventListener('click', (e) => {
        const tabBtn = e.target.closest('[data-tab-id]');
        if (tabBtn) {
          switchTab(tabBtn.dataset.tabId);
          return;
        }

        const phaseBtn = e.target.closest('[data-phase]');
        if (phaseBtn) {
          state.activePhase = phaseBtn.dataset.phase;
          renderMainContent();
          return;
        }

        // Edit & Padam Checklist
        const editChk = e.target.closest('[data-edit-chk]');
        if (editChk) {
          openChecklistModal(editChk.dataset.editChk);
          return;
        }
        const delChk = e.target.closest('[data-del-chk]');
        if (delChk) {
          openConfirmModal('Padam Item Checklist?', 'Item ini akan dipadam daripada senarai persediaan.', () => {
            state.data.checklist = state.data.checklist.filter((x) => x.id !== delChk.dataset.delChk);
            saveState();
            renderAll();
            showToast('Item dipadam');
          });
          return;
        }

        // Edit & Padam Itinerary
        const editItin = e.target.closest('[data-edit-itin]');
        if (editItin) {
          openItineraryModal(editItin.dataset.editItin);
          return;
        }
        const delItin = e.target.closest('[data-del-itin]');
        if (delItin) {
          openConfirmModal('Padam Aktiviti?', 'Aktiviti ini akan dipadam daripada jadual perjalanan.', () => {
            state.data.itinerary = state.data.itinerary.filter((x) => x.id !== delItin.dataset.delItin);
            saveState();
            renderAll();
            showToast('Aktiviti dipadam');
          });
          return;
        }

        // Edit & Padam Ahli
        const editMem = e.target.closest('[data-edit-member]');
        if (editMem) {
          openMemberModal(editMem.dataset.editMember);
          return;
        }
        const delMem = e.target.closest('[data-del-member]');
        if (delMem) {
          const mem = state.data.members.find((x) => x.id === delMem.dataset.delMember);
          if (!mem) return;
          openConfirmModal(`Padam Ahli "${mem.nama}"?`, 'Rekod ahli ini dan lajur statusnya dalam checklist akan dipadam.', () => {
            state.data.members = state.data.members.filter((x) => x.id !== mem.id);
            state.data.checklist.forEach((chk) => {
              if (chk.statusAhli) delete chk.statusAhli[mem.nama];
            });
            saveState();
            renderAll();
            showToast('Ahli dipadam');
          });
          return;
        }

        // Butang Export & Reset di tab Tetapan
        if (e.target.closest('#btn-export-json')) {
          exportJson();
          return;
        }
        if (e.target.closest('#btn-export-csv')) {
          exportCsv();
          return;
        }
        if (e.target.closest('#btn-reset-data')) {
          openConfirmModal('Reset ke Data Asal?', 'Semua perubahan semasa akan digantikan semula dengan data asal Korea Trip Planner.', () => {
            state.data = getDefaultData();
            saveState();
            updateConverterRateLabel();
            renderAll();
            showToast('Data dikembalikan ke tetapan asal ♻️');
          });
          return;
        }
      });

      // Delegasi Perubahan Dropdown Inline & Input Fail
      document.addEventListener('change', (e) => {
        if (e.target.matches('.chk-inline-select')) {
          const { chkId, member } = e.target.dataset;
          const item = state.data.checklist.find((x) => x.id === chkId);
          if (item) {
            if (!item.statusAhli) item.statusAhli = {};
            item.statusAhli[member] = e.target.value;
            saveState();
            renderMainContent();
            showToast(`${member}: ${e.target.value} ✔`);
          }
          return;
        }

        if (e.target.matches('.itin-status-select')) {
          const item = state.data.itinerary.find((x) => x.id === e.target.dataset.itinId);
          if (item) {
            item.status = e.target.value;
            saveState();
            renderMainContent();
            showToast(`Status: ${e.target.value} ✔`);
          }
          return;
        }

        if (e.target.id === 'inp-import-json') {
          handleImportJson(e.target.files[0]);
          e.target.value = '';
        }
      });

      // Delegasi Submit Borang Tetapan
      document.addEventListener('submit', (e) => {
        if (e.target.id === 'form-tetapan') {
          e.preventDefault();
          const newRate = parseFloat($('#set-kadar').value);
          state.data.settings = {
            kadar: !isNaN(newRate) && newRate > 0 ? newRate : 0.003063,
            tarikhBerlepas: $('#set-berlepas').value,
            tarikhBalik: $('#set-balik').value,
            penerbangan: $('#set-penerbangan').value.trim(),
            penginapan: $('#set-penginapan').value.trim(),
            alamatHangul: $('#set-hangul').value.trim()
          };
          saveState();
          updateConverterRateLabel();
          renderAll();
          showToast('Tetapan disimpan ✔');
        }
      });

      // Tutup modal dengan kekunci Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && $('#modal-root').innerHTML !== '') {
          closeModal();
        }
      });
    });
  </script>
</body>
</html>
