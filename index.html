    /**
     * ============================================================================
     * KOREA TRIP PLANNER — AUTO-CONNECT GOOGLE APPS SCRIPT + CACHE-FIRST ENGINE
     * ============================================================================
     */

    // URL Web App Google Apps Script lalai yang ditanam terus supaya semua 6 ahli
    // automatik bersambung dengan Google Sheet 'Korea_Trip_Planner' tanpa tetapan manual.
    const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxYNeYD4tSRsbYAxiAFSESgv3cGBbxK5Rqz8l7kJr3u0jzBBTkeqLQtIJArbVs5KoYJdg/exec';

    const API_URL_KEY = 'korea_trip_custom_script_url_v1';
    const CACHE_KEY = 'korea_trip_sheet_cache_v2';
    const THEME_KEY = 'korea_trip_theme_v1';
    const POLL_MS = 20000; // Segerak automatik setiap 20 saat apabila tab aktif

    const TABS = [
      { id: 'Checklist', label: '✅ Checklist' },
      { id: 'Itinerary', label: '🗓️ Itinerary' },
      { id: 'Ahli', label: '👥 Ahli' },
      { id: 'Tetapan', label: '⚙️ Tetapan' }
    ];

    const PHASES = ['Before', 'During', 'After'];
    const STATUS_OPTIONS = ['Belum', 'Dalam proses', 'Siap'];
    const YN_OPTIONS = ['Belum', 'Dah'];

    // Kod Google Apps Script (Code.gs) lengkap untuk salinan sandaran dalam tab Tetapan
    const APPS_SCRIPT_CODE = `// ============================================================================
// Korea Trip Planner — Google Apps Script Backend (JSON API)
// Tampal kod ini dalam: Google Sheet > Extensions > Apps Script > Code.gs
// ============================================================================

const SS_ID = '1kQrcKRAAM_34fbBWrftu-NnNM7hZ7G-Y9Rjv1mft5z8';
const SHEETS = ['Checklist', 'Itinerary', 'Ahli', 'Tetapan'];
const MAX_ROW = 200;
const FORMULA_COLS = { Checklist: ['Siap'], Itinerary: ['Setara (RM)'] };
const FORMULA_CHECK = { Checklist: ['Anggaran / orang (RM)'], Tetapan: ['Nilai'] };
const NUMERIC = /\\((RM|KRW)\\)|^Hari$/;

function getSS_() {
  return SpreadsheetApp.getActiveSpreadsheet() || SpreadsheetApp.openById(SS_ID);
}

function jsonOut_(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

// Memulangkan data JSON untuk panggilan GET dari GitHub Pages / pelayar
function doGet(e) {
  try {
    return jsonOut_({ ok: true, data: getData() });
  } catch (err) {
    return jsonOut_({ ok: false, error: err.message });
  }
}

// Menerima perubahan (updateCell / saveRow / removeRow) melalui POST text/plain
function doPost(e) {
  try {
    const raw = (e && e.postData && e.postData.contents) || '{}';
    const body = JSON.parse(raw);
    const action = body.action;

    if (action === 'getData') {
      return jsonOut_({ ok: true, data: getData() });
    }
    if (action === 'updateCell') {
      updateCell(body.sheet, Number(body.row), body.header, body.value);
      return jsonOut_({ ok: true, sheet: body.sheet, sheetData: readSheet_(body.sheet) });
    }
    if (action === 'saveRow') {
      const sheetData = saveRow(body.sheet, body.row ? Number(body.row) : null, body.values || {});
      return jsonOut_({ ok: true, sheet: body.sheet, sheetData: sheetData });
    }
    if (action === 'removeRow') {
      const sheetData = removeRow(body.sheet, Number(body.row));
      return jsonOut_({ ok: true, sheet: body.sheet, sheetData: sheetData });
    }
    return jsonOut_({ ok: false, error: 'Tindakan tidak dikenali: ' + action });
  } catch (err) {
    return jsonOut_({ ok: false, error: err.message });
  }
}

function getData() {
  const cache = CacheService.getScriptCache();
  const hit = cache.get('data_v2');
  if (hit) {
    try { return JSON.parse(hit); } catch (e) {}
  }
  const ss = getSS_();
  const out = {};
  SHEETS.forEach(n => { out[n] = readSheet_(n, ss); });
  try { cache.put('data_v2', JSON.stringify(out), 10); } catch (e) {}
  return out;
}

function invalidate_() {
  try { CacheService.getScriptCache().remove('data_v2'); } catch (e) {}
}

function limit_(sh) {
  return Math.min(MAX_ROW, sh.getMaxRows());
}

function readSheet_(name, ss) {
  ss = ss || getSS_();
  const sh = ss.getSheetByName(name);
  if (!sh) return { headers: [], rows: [], formulaCols: [] };
  const fcols = FORMULA_COLS[name] || [];
  const n = limit_(sh);
  const lastCol = sh.getLastColumn();
  if (lastCol < 1 || n < 1) return { headers: [], rows: [], formulaCols: fcols };

  const values = sh.getRange(1, 1, n, lastCol).getValues();
  const headers = values[0].map(String);
  const fchk = (FORMULA_CHECK[name] || []).map(h => headers.indexOf(h)).filter(c => c >= 0);
  const fmap = {};
  fchk.forEach(c => { fmap[c] = sh.getRange(1, c + 1, n, 1).getFormulas(); });

  let tz = null;
  const rows = [];
  for (let i = 1; i < values.length; i++) {
    const cells = values[i].map(v => {
      if (v instanceof Date) {
        tz = tz || ss.getSpreadsheetTimeZone();
        return Utilities.formatDate(v, tz, 'dd/MM/yyyy');
      }
      return v === null || v === undefined ? '' : String(v);
    });
    const hasData = headers.some((h, c) => fcols.indexOf(h) < 0 && cells[c] !== '');
    if (!hasData) continue;
    rows.push({
      row: i + 1,
      cells: cells,
      f: fchk.filter(c => fmap[c][i][0])
    });
  }
  return { headers: headers, rows: rows, formulaCols: fcols };
}

function sheet_(name) {
  if (SHEETS.indexOf(name) < 0) throw new Error('Sheet tak sah: ' + name);
  const sh = getSS_().getSheetByName(name);
  if (!sh) throw new Error('Sheet "' + name + '" tak jumpa');
  return sh;
}

function withLock_(fn) {
  const lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try { return fn(); } finally { lock.releaseLock(); }
}

function clean_(header, v) {
  if (v === null || v === undefined) return '';
  if (NUMERIC.test(header)) {
    if (v === '') return '';
    const n = Number(v);
    return isNaN(n) ? String(v) : n;
  }
  v = String(v);
  return v.charAt(0) === '=' ? "'" + v : v;
}

function writeCells_(sh, name, row, values) {
  const headers = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String);
  const fcols = FORMULA_COLS[name] || [];
  headers.forEach((h, i) => {
    if (fcols.indexOf(h) >= 0) return;
    if (!Object.prototype.hasOwnProperty.call(values, h)) return;
    const cell = sh.getRange(row, i + 1);
    if (cell.getFormula()) return;
    cell.setValue(clean_(h, values[h]));
  });
}

function checkRow_(sh, row) {
  if (!(row >= 2 && row <= limit_(sh))) throw new Error('Baris tak sah: ' + row);
}

function updateCell(name, row, header, value) {
  return withLock_(() => {
    const sh = sheet_(name);
    checkRow_(sh, row);
    const o = {};
    o[header] = value;
    writeCells_(sh, name, row, o);
    invalidate_();
    SpreadsheetApp.flush();
    return true;
  });
}

function saveRow(name, row, values) {
  return withLock_(() => {
    const sh = sheet_(name);
    let target = row;
    if (target) {
      checkRow_(sh, target);
    } else {
      target = findEmptyRow_(sh, name);
      if (!target) throw new Error('Sheet penuh (had ' + MAX_ROW + ' baris)');
    }
    writeCells_(sh, name, target, values);
    invalidate_();
    SpreadsheetApp.flush();
    return readSheet_(name);
  });
}

function removeRow(name, row) {
  return withLock_(() => {
    const sh = sheet_(name);
    checkRow_(sh, row);
    const headers = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String);
    const fcols = FORMULA_COLS[name] || [];
    headers.forEach((h, i) => {
      if (fcols.indexOf(h) >= 0) return;
      const cell = sh.getRange(row, i + 1);
      if (!cell.getFormula()) cell.clearContent();
    });
    invalidate_();
    SpreadsheetApp.flush();
    return readSheet_(name);
  });
}

function findEmptyRow_(sh, name) {
  const fcols = FORMULA_COLS[name] || [];
  const values = sh.getRange(1, 1, limit_(sh), sh.getLastColumn()).getValues();
  const headers = values[0].map(String);
  for (let i = 1; i < values.length; i++) {
    const empty = headers.every((h, c) => fcols.indexOf(h) >= 0 || values[i][c] === '' || values[i][c] === null);
    if (empty) return i + 1;
  }
  const max = sh.getMaxRows();
  if (max < MAX_ROW) {
    sh.insertRowsAfter(max, Math.min(20, MAX_ROW - max));
    return max + 1;
  }
  return 0;
}`;

    // ==================== KEADAAN APLIKASI (STATE) ====================
    const state = {
      apiUrl: getActiveScriptUrl(),
      data: loadCachedData(),

      activePhase: 'Before',
      showConverter: true,

      lastJsonHash: ''

    // Mengembalikan URL tersuai jika pengguna pernah simpan override; jika tiada, guna DEFAULT_SCRIPT_URL
    function getActiveScriptUrl() {
      try {
        const custom = localStorage.getItem(API_URL_KEY);
        if (custom && custom.trim()) return custom.trim();
      } catch (e) {}
      return DEFAULT_SCRIPT_URL;
    }

    function setCustomScriptUrl(url) {
      const clean = (url || '').trim();
      try {
        if (!clean || clean === DEFAULT_SCRIPT_URL) {
          localStorage.removeItem(API_URL_KEY);
          state.apiUrl = DEFAULT_SCRIPT_URL;
        } else {
          localStorage.setItem(API_URL_KEY, clean);
          state.apiUrl = clean;
        }
      } catch (e) {
        state.apiUrl = clean || DEFAULT_SCRIPT_URL;
      }
    }

    function loadCachedData() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.Checklist && parsed.Tetapan && parsed.Ahli && parsed.Itinerary) {
            return parsed;
          }
        }
      } catch (e) {
        console.warn('Cache tempatan tidak sah, memuatkan data lalai:', e);
      }
      return getDefaultSheetData();
    }

    function saveCachedData() {
      try {
        const serialized = JSON.stringify(state.data);
        state.lastJsonHash = serialized;
        localStorage.setItem(CACHE_KEY, serialized);
      } catch (e) {
        console.warn('Gagal menyimpan cache localStorage:', e);
      }
    }

    // ==================== FUNGSI BANTUAN UMUM ====================
    const $ = (sel) => document.querySelector(sel);
    const esc = (str) => String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    const linkify = (str) => esc(str).replace(
      /(https?:\/\/[^\s<]+)/g,
      '<a href="$1" target="_blank" rel="noopener noreferrer" class="underline text-brand-600 dark:text-brand-400 hover:opacity-80 font-medium">pautan ↗</a>'
    );

    const idx = (d, header) => (d && Array.isArray(d.headers)) ? d.headers.indexOf(header) : -1;
    const idxAny = (d, candidates) => {
      if (!d || !Array.isArray(d.headers)) return -1;
      for (const h of candidates) {
        const i = d.headers.indexOf(h);
        if (i >= 0) return i;
      }
      return -1;
    };

    const fmtMoney = (val) => {
      const n = Number(val);
      if (isNaN(n)) return esc(val);
      return n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const fmtInt = (val) => {
      const n = Number(val);
      if (isNaN(n)) return esc(val);
      return Math.round(n).toLocaleString('en-MY');
    };

    function showToast(message) {

    function copyTextToClipboard(text, successMsg = 'Berjaya disalin!') {
      if (!text) return;
      const helper = $('#clipboard-helper');
      helper.value = text;
      helper.focus();
      helper.select();

    // ==================== PARSING TARIKH (dd/MM/yyyy & yyyy-MM-dd) ====================
    function parseDMY(s) {
      if (!s) return null;
      const str = String(s).trim();
      let m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(str);
      if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
      if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      return null;
    }

    function toISO(s) {
      if (!s) return '';
      const str = String(s).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
      const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(str);
      return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
    }

    function fromISO(s) {
      if (!s) return '';
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
      return m ? `${m[3]}/${m[2]}/${m[1]}` : String(s).trim();
    }

    // ==================== HELPER DATA SHEET ====================
    function getSettingsMap() {
      const t = state.data.Tetapan;
      const map = {};
      if (t) {
        const iK = idx(t, 'Kunci');
        const iV = idx(t, 'Nilai');
        t.rows.forEach((r) => {
          if (iK >= 0 && iV >= 0) map[r.cells[iK]] = r.cells[iV];
        });
      }
      return map;
    }

    function getActiveRate() {
      const s = getSettingsMap();
      const used = Number(s['Kadar digunakan']);
      if (!isNaN(used) && used > 0) return used;
      const auto = Number(s['Kadar auto (1 KRW = RM)']);
      if (!isNaN(auto) && auto > 0) return auto;
      const man = Number(s['Kadar manual (cadangan)']);
      if (!isNaN(man) && man > 0) return man;
      return 0.003063;
    }

    function getMembersList() {
      const a = state.data.Ahli;
      const c = state.data.Checklist;
      const namesFromAhli = a ? a.rows.map((r) => r.cells[idx(a, 'Nama')]).filter(Boolean) : [];
      if (c && Array.isArray(c.headers)) {
        const matched = c.headers.filter((h) => namesFromAhli.includes(h));
        if (matched.length) return matched;
        const start = idx(c, 'Anggaran / orang (RM)');
        const end = idx(c, 'Siap');
        if (start >= 0 && end > start + 1) {
          return c.headers.slice(start + 1, end);
        }
      }
      return namesFromAhli.length ? namesFromAhli : ['Hasif', 'Aiman', 'Ina', 'Atika', 'Fifie', 'Shikkin'];
    }

    function getPassportStatus(val) {
      if (!val) return { code: 'empty', html: '<span class="text-xs text-slate-400">Belum diisi</span>' };
      const exp = parseDMY(val);
      if (!exp) return { code: 'empty', html: `<span class="text-xs text-slate-500">${esc(val)}</span>` };

      const s = getSettingsMap();
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const ref = parseDMY(s['Tarikh balik']) || parseDMY(s['Tarikh berlepas']) || today;
      const sixMonths = new Date(ref.getFullYear(), ref.getMonth() + 6, ref.getDate());

      if (exp < today) {
        return {
          code: 'bad',
          html: '<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 border border-red-200 dark:border-red-800">⚠️ Dah luput</span>'
        };
      }
      if (exp < sixMonths) {
        return {
          code: 'bad',
          html: '<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border border-amber-200 dark:border-amber-800">⚠️ Kurang 6 bulan</span>'
        };
      }
      return {
        code: 'good',
        html: '<span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">✅ OK</span>'
      };
    }

    function getPassportWarnings() {
      const a = state.data.Ahli;
      if (!a) return [];
      const iN = idx(a, 'Nama');
      const iP = idx(a, 'Tarikh Luput Pasport');
      if (iN < 0 || iP < 0) return [];
      return a.rows
        .filter((r) => getPassportStatus(r.cells[iP]).code === 'bad')
        .map((r) => r.cells[iN])
        .filter(Boolean);
    }

    // ==================== PENYEGERAKAN DUA HALA (GOOGLE APPS SCRIPT) ====================
    function updateSyncPillUI() {
      const dot = $('#sync-dot');
      const label = $('#sync-label');
      if (!dot || !label) return;

      if (state.syncStatus === 'syncing' || state.pendingOps > 0) {
        dot.className = 'w-2 h-2 rounded-full bg-sky-400 animate-pulse';
        label.textContent = 'Menyambung…';
        return;
      }

      if (state.syncStatus === 'error') {
        dot.className = 'w-2 h-2 rounded-full bg-red-400';
        label.textContent = 'Ralat Sync';
        return;
      }

      if (state.syncStatus === 'live') {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
        const timeStr = state.lastSyncTime
          ? state.lastSyncTime.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' })
          : '';
        label.textContent = timeStr ? `Live · ${timeStr}` : 'Live';
        return;
      }

      dot.className = 'w-2 h-2 rounded-full bg-sky-400 animate-pulse';
      label.textContent = 'Menyambung…';
    }

    // Tarik data terkini dari Google Sheet melalui GET (redirect: 'follow')
    async function fetchFromSheet({ silent = false, showToastOnSuccess = false } = {}) {
      const targetUrl = state.apiUrl || DEFAULT_SCRIPT_URL;
      if (!silent) {
        state.syncStatus = 'syncing';
        updateSyncPillUI();
      }

      try {
        const sep = targetUrl.includes('?') ? '&' : '?';
        const url = `${targetUrl}${sep}action=getData&t=${Date.now()}`;
        const res = await fetch(url, {
          method: 'GET',
          redirect: 'follow'
        });

        const text = await res.text();
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (parseErr) {
          if (text.trim().startsWith('<')) {
            throw new Error('Google memulangkan halaman HTML/Login. Pastikan Deploy Web App ditetapkan kepada "Execute as: Me" dan "Who has access: Anyone".');
          }
          throw new Error('Respons daripada Apps Script bukan format JSON yang sah.');
        }

        // Sokong kedua-dua bentuk JSON: { ok: true, data: {...} } dan terus { Checklist: {...} }
        let sheetPayload = null;
        if (parsed && typeof parsed === 'object') {
          if (parsed.ok === false) {
            throw new Error(parsed.error || 'Apps Script memulangkan ralat.');
          }
          if (parsed.ok === true && parsed.data && parsed.data.Checklist) {
            sheetPayload = parsed.data;
          } else if (parsed.Checklist && parsed.Tetapan) {
            sheetPayload = parsed;
          }
        }

        if (!sheetPayload) {
          throw new Error('Struktur data JSON tidak mengandungi tab Checklist / Tetapan.');
        }

        const newHash = JSON.stringify(sheetPayload);
        const changed = newHash !== state.lastJsonHash;

        state.data = sheetPayload;
        saveCachedData();
        state.syncStatus = 'live';
        state.lastSyncTime = new Date();
        state.lastSyncError = '';
        updateSyncPillUI();

        if (changed) {
          updateConverterRateLabel();
          renderAll();
          if (silent) showToast('Dikemas kini dari Google Sheet 🔄');
        }
        if (showToastOnSuccess) {
          showToast('Berjaya disegerak dengan Google Sheet! ✅');
        }
        return true;
      } catch (err) {
        state.syncStatus = 'error';
        state.lastSyncError = err.message || 'Gagal menghubungi Google Apps Script.';
        updateSyncPillUI();
        if (!silent) {
          showToast('Ralat Sync: Klik pil "Ralat Sync" di atas untuk butiran');
        }
        return false;
      }
    }

    // Hantar perubahan (updateCell / saveRow / removeRow) melalui POST text/plain (elak CORS preflight)
    async function postToSheet(payload, successToastMsg = 'Disimpan ke Sheet ✔') {
      const targetUrl = state.apiUrl || DEFAULT_SCRIPT_URL;
      state.pendingOps++;
      updateSyncPillUI();

      try {
        const res = await fetch(targetUrl, {
          method: 'POST',
          redirect: 'follow',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Respons POST bukan JSON sah. Semak tetapan Deploy Apps Script.');
        }

        if (json.ok === false) {
          throw new Error(json.error || 'Gagal menyimpan ke Google Sheet.');
        }

        if (json.sheet && json.sheetData) {
          state.data[json.sheet] = json.sheetData;
          saveCachedData();
          updateConverterRateLabel();
          renderAll();
        } else if (json.data && json.data.Checklist) {
          state.data = json.data;
          saveCachedData();
          updateConverterRateLabel();
          renderAll();
        }

        state.syncStatus = 'live';
        state.lastSyncTime = new Date();
        state.lastSyncError = '';
        if (successToastMsg) showToast(successToastMsg);
        return true;
      } catch (err) {
        state.syncStatus = 'error';
        state.lastSyncError = err.message || 'Gagal menghantar kemas kini ke Google Sheet.';
        showToast('Disimpan lokal, tetapi gagal sync ke Sheet ⚠️');
        return false;
      } finally {
        state.pendingOps = Math.max(0, state.pendingOps - 1);
        updateSyncPillUI();
      }
    }

      $('#inp-krw').value = Math.round(rm / rate);

      const phaseOf = (r) => (iF >= 0 && PHASES.includes(r.cells[iF])) ? r.cells[iF] : 'Before';

      // Pil penapis fasa (Before, During, After)
      const pillsHtml = PHASES.map((p) => {

        const colIdx = idx(d, m);
        const done = colIdx >= 0 ? rows.filter((r) => r.cells[colIdx] === 'Dah').length : 0;
        const pct = rows.length ? Math.round((done / rows.length) * 100) : 0;
        return `
          <div class="bg-slate-50 dark:bg-slate-800/70 rounded-xl p-2.5 border border-slate-200/70 dark:border-slate-700/70">
            <div class="flex items-center justify-between text-xs mb-1.5">
              <span class="font-bold text-slate-800 dark:text-slate-100 truncate">${esc(m)}</span>
              <span class="font-semibold text-slate-500 dark:text-slate-400">${done}/${rows.length}</span>
            </div>
            <div class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      const sumPerPerson = rows.reduce((sum, r) => sum + (iA >= 0 ? (Number(r.cells[iA]) || 0) : 0), 0);
      const sumGroup = sumPerPerson * members.length;

      let tableHtml = '';
      if (!rows.length) {
        tableHtml = `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-10 text-center">
            <p class="text-slate-500 dark:text-slate-400 text-sm">Belum ada item dalam fasa <strong>${esc(state.activePhase)}</strong>. Tekan "+ Tambah Item" untuk mula.</p>
          </div>
        `;
      } else {
        const memHeaders = members.map((m) => `<th class="px-3 py-3 text-center text-xs font-bold uppercase tracking-wider whitespace-nowrap">${esc(m)}</th>`).join('');
        const bodyRows = rows.map((r) => {
          const doneCount = members.filter((m) => {
            const c = idx(d, m);
            return c >= 0 && r.cells[c] === 'Dah';
          }).length;
          const allDone = members.length > 0 && doneCount === members.length;

          const memCells = members.map((m) => {
            const c = idx(d, m);
            const val = c >= 0 ? (r.cells[c] || 'Belum') : 'Belum';
            const isDah = val === 'Dah';
            return `
              <td class="px-2.5 py-2.5 text-center whitespace-nowrap">
                <select data-inline-chk data-row="${r.row}" data-header="${esc(m)}"
                  class="text-xs font-semibold rounded-lg px-2 py-1.5 border cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand-500 transition ${
                    isDah
                      ? 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950 dark:text-emerald-300 dark:border-emerald-700'
                      : 'bg-slate-100 text-slate-700 border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700'
                  }">
                  ${YN_OPTIONS.map((o) => `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`).join('')}
                </select>
              </td>
            `;
          }).join('');

          const costVal = iA >= 0 ? r.cells[iA] : '';
          const costDisplay = costVal !== '' && !isNaN(Number(costVal)) && Number(costVal) > 0
            ? `RM ${fmtMoney(costVal)}`
            : (costVal !== '' && !isNaN(Number(costVal)) && Number(costVal) === 0 ? 'RM 0.00' : '<span class="text-slate-400">–</span>');

          return `
            <tr class="border-b border-slate-100 dark:border-slate-800/80 hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
              <td class="px-3.5 py-3 whitespace-nowrap">
                <span class="inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-brand-50 text-brand-700 dark:bg-brand-900/40 dark:text-brand-200 border border-brand-100 dark:border-brand-800">
                  ${esc(iK >= 0 ? r.cells[iK] : '')}
                </span>
              </td>
              <td class="px-3.5 py-3 font-semibold text-slate-900 dark:text-white min-w-[160px]">
                ${esc(iI >= 0 ? r.cells[iI] : '')}
              </td>
              <td class="px-3.5 py-3 text-right font-semibold whitespace-nowrap text-slate-700 dark:text-slate-200">
                ${costDisplay}
              </td>
              ${memCells}
              <td class="px-3.5 py-3 text-center whitespace-nowrap">
                <span class="inline-block text-xs font-bold px-2.5 py-1 rounded-full ${
                  allDone
                    ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300'
                    : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'
                }">
                  ${doneCount}/${members.length}
                </span>
              </td>
              <td class="px-3.5 py-3 text-xs text-slate-600 dark:text-slate-400 min-w-[180px]">
                ${linkify(iN >= 0 ? r.cells[iN] : '')}
              </td>
              <td class="px-3.5 py-3 text-right whitespace-nowrap">
                <button type="button" data-act="edit" data-sheet="Checklist" data-row="${r.row}" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Edit">✏️</button>
                <button type="button" data-act="del" data-sheet="Checklist" data-row="${r.row}" class="p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-950 transition" title="Padam">🗑️</button>
              </td>
            </tr>
          `;
        }).join('');

        tableHtml = `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto thin-scroll">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="bg-brand-600 dark:bg-slate-800 text-white">
                    <th class="px-3.5 py-3 text-xs font-bold uppercase tracking-wider whitespace-nowrap">Kategori</th>
                    <th class="px-3.5 py-3 text-xs font-bold uppercase tracking-wider whitespace-nowrap">Item</th>
                    <th class="px-3.5 py-3 text-right text-xs font-bold uppercase tracking-wider whitespace-nowrap">Anggaran / orang (RM)</th>
                    ${memHeaders}
                    <th class="px-3.5 py-3 text-center text-xs font-bold uppercase tracking-wider whitespace-nowrap">Siap</th>
                    <th class="px-3.5 py-3 text-xs font-bold uppercase tracking-wider whitespace-nowrap">Nota</th>
                    <th class="px-3.5 py-3 text-right text-xs font-bold uppercase tracking-wider whitespace-nowrap">Tindakan</th>
                  </tr>
                </thead>
                <tbody>${bodyRows}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      return `
        <div class="animate-in space-y-4">
          ${renderPassportAlert()}
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">${pillsHtml}</div>
            <span class="text-xs text-slate-500 dark:text-slate-400">Tukar <strong>Dah / Belum</strong> terus dalam jadual</span>
          </div>

          ${rows.length ? `
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">
                Kemajuan Ahli (${esc(state.activePhase)})
              </h3>
              <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
                ${progressBarsHtml}
              </div>
            </div>
          ` : ''}

          ${tableHtml}

          ${rows.length ? `
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Jumlah Anggaran ${esc(state.activePhase)} (Seorang)
                </p>
                <p class="text-xl sm:text-2xl font-extrabold text-brand-600 dark:text-brand-400 mt-0.5">
                  RM ${fmtMoney(sumPerPerson)}
                </p>
              </div>
              <div class="sm:text-right border-t sm:border-t-0 pt-2.5 sm:pt-0 border-slate-100 dark:border-slate-800">
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  Anggaran Kumpulan (${members.length} Orang)
                </p>
                <p class="text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-100 mt-0.5">
                  RM ${fmtMoney(sumGroup)}
                </p>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // ==================== TAB 2: ITINERARY ====================
    function renderItineraryTab() {
      const d = state.data.Itinerary;
      if (!d) return '';

      const rate = getActiveRate();
      const iH = idx(d, 'Hari');
      const iT = idx(d, 'Tarikh');
      const iM = idx(d, 'Masa');
      const iAkt = idx(d, 'Aktiviti');
      const iLok = idx(d, 'Lokasi');
      const iBan = idx(d, 'Bandar');
      const iTr = idx(d, 'Pengangkutan');
      const iKrw = idx(d, 'Anggaran (KRW)');
      const iRm = idx(d, 'Setara (RM)');
      const iTmp = idxAny(d, ['Tempahan / Link', 'Tempahan']);
      const iSt = idx(d, 'Status');
      const iNot = idx(d, 'Nota');

      if (!d.rows.length) {
        return `
          <div class="animate-in">
            ${renderPassportAlert()}
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-10 text-center space-y-3">
              <div class="text-4xl">🗓️</div>
              <h3 class="text-base font-bold text-slate-900 dark:text-white">Belum ada aktiviti dalam Itinerary</h3>
              <p class="text-slate-500 dark:text-slate-400 text-sm max-w-md mx-auto">
                Tekan butang <strong>"+ Tambah Aktiviti"</strong> di penjuru bawah kanan untuk mula menyusun jadual perjalanan anda.
              </p>
            </div>
          </div>
        `;
      }

      const sorted = [...d.rows].sort((a, b) => {
        const ha = iH >= 0 && a.cells[iH] !== '' ? Number(a.cells[iH]) : 1e9;
        const hb = iH >= 0 && b.cells[iH] !== '' ? Number(b.cells[iH]) : 1e9;
        const ma = iM >= 0 ? String(a.cells[iM]) : '';
        const mb = iM >= 0 ? String(b.cells[iM]) : '';
        return ha - hb || ma.localeCompare(mb) || a.row - b.row;
      });

      const groups = [];
      sorted.forEach((r) => {
        const k = iH >= 0 ? String(r.cells[iH]).trim() : '';
        let g = groups.find((x) => x.k === k);
        if (!g) {
          g = { k, rows: [] };
          groups.push(g);
        }
        g.rows.push(r);
      });

      const grandKrw = sorted.reduce((s, r) => s + (iKrw >= 0 ? (Number(r.cells[iKrw]) || 0) : 0), 0);
      const grandRm = grandKrw * rate;

      const dayCards = groups.map((g) => {
        const dayKrw = g.rows.reduce((s, r) => s + (iKrw >= 0 ? (Number(r.cells[iKrw]) || 0) : 0), 0);
        const dayRm = dayKrw * rate;
        const firstDate = iT >= 0 ? g.rows.map((r) => r.cells[iT]).find(Boolean) : '';
        const title = g.k === '' ? 'Belum ditetapkan' : `Hari ${esc(g.k)}`;

        const rowsHtml = g.rows.map((r) => {
          const krwVal = iKrw >= 0 ? r.cells[iKrw] : '';
          const krwNum = Number(krwVal) || 0;
          const sheetRm = iRm >= 0 ? r.cells[iRm] : '';
          const rmNum = sheetRm !== '' && !isNaN(Number(sheetRm)) && Number(sheetRm) > 0
            ? Number(sheetRm)
            : krwNum * rate;

          const lok = iLok >= 0 ? r.cells[iLok] : '';
          const ban = iBan >= 0 ? r.cells[iBan] : '';
          const q = encodeURIComponent([lok, ban, 'Korea'].filter(Boolean).join(' '));

          const st = iSt >= 0 ? (r.cells[iSt] || 'Belum') : 'Belum';
          const stClass = st === 'Siap'
            ? 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950 dark:text-emerald-300 dark:border-emerald-700'
            : st === 'Dalam proses'
            ? 'bg-amber-100 text-amber-800 border-amber-300 dark:bg-amber-950 dark:text-amber-300 dark:border-amber-700'
            : 'bg-slate-100 text-slate-700 border-slate-300 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700';

          const tmp = iTmp >= 0 ? r.cells[iTmp] : '';
          const not = iNot >= 0 ? r.cells[iNot] : '';

          return `
            <tr class="border-b border-slate-100 dark:border-slate-800/80 hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
              <td class="px-3.5 py-3 font-bold text-brand-600 dark:text-brand-400 whitespace-nowrap">
                ${esc(iM >= 0 && r.cells[iM] ? r.cells[iM] : '–')}
              </td>
              <td class="px-3.5 py-3 min-w-[190px]">
                <div class="font-semibold text-slate-900 dark:text-white">${esc(iAkt >= 0 ? r.cells[iAkt] : '')}</div>
                ${iTr >= 0 && r.cells[iTr] ? `<div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">🚆 ${esc(r.cells[iTr])}</div>` : ''}
              </td>
              <td class="px-3.5 py-3 min-w-[175px]">
                ${lok ? `
                  <div class="font-medium text-slate-800 dark:text-slate-200">${esc(lok)}</div>
                  <div class="flex items-center gap-2 text-xs mt-1">
                    <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener noreferrer"
                      class="text-blue-600 dark:text-blue-400 hover:underline font-medium">📍 Google</a>
                    <span class="text-slate-300 dark:text-slate-700">·</span>
                    <a href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener noreferrer"
                      class="text-emerald-600 dark:text-emerald-400 hover:underline font-medium">Naver</a>
                  </div>
                ` : '<span class="text-slate-400">–</span>'}
              </td>
              <td class="px-3.5 py-3 text-xs font-medium text-slate-600 dark:text-slate-300 whitespace-nowrap">
                ${esc(ban || '–')}
              </td>
              <td class="px-3.5 py-3 text-right font-semibold whitespace-nowrap text-slate-800 dark:text-slate-200">
                ${krwNum > 0 ? `₩${fmtInt(krwNum)}` : '<span class="text-slate-400">–</span>'}
              </td>
              <td class="px-3.5 py-3 text-right font-semibold whitespace-nowrap text-emerald-700 dark:text-emerald-400">
                ${krwNum > 0 ? `RM ${fmtMoney(rmNum)}` : '<span class="text-slate-400">–</span>'}
              </td>
              <td class="px-3.5 py-3 text-center whitespace-nowrap">
                <select data-inline-itin data-row="${r.row}" data-header="Status"
                  class="text-xs font-semibold rounded-lg px-2.5 py-1.5 border cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand-500 ${stClass}">
                  ${STATUS_OPTIONS.map((o) => `<option value="${o}" ${o === st ? 'selected' : ''}>${o}</option>`).join('')}
                </select>
              </td>
              <td class="px-3.5 py-3 text-xs text-slate-600 dark:text-slate-400 min-w-[170px]">
                ${tmp ? `<div class="mb-0.5">${linkify(tmp)}</div>` : ''}
                ${linkify(not)}
              </td>
              <td class="px-3.5 py-3 text-right whitespace-nowrap">
                <button type="button" data-act="edit" data-sheet="Itinerary" data-row="${r.row}" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Edit">✏️</button>
                <button type="button" data-act="del" data-sheet="Itinerary" data-row="${r.row}" class="p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-950 transition" title="Padam">🗑️</button>
              </td>
            </tr>
          `;
        }).join('');

        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden">
            <div class="bg-slate-100/90 dark:bg-slate-800/90 px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <span class="px-3 py-1 rounded-lg bg-brand-600 text-white text-xs sm:text-sm font-bold">${title}</span>
                ${firstDate ? `<span class="text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300">📅 ${esc(firstDate)}</span>` : ''}
              </div>
              <div class="text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200">
                Jumlah: <span class="text-brand-600 dark:text-brand-400">₩${fmtInt(dayKrw)}</span>
                <span class="text-slate-400 mx-1">≈</span>
                <span class="text-emerald-600 dark:text-emerald-400">RM ${fmtMoney(dayRm)}</span>
              </div>
            </div>
            <div class="overflow-x-auto thin-scroll">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="border-b border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 bg-slate-50/50 dark:bg-slate-900">
                    <th class="px-3.5 py-2.5 text-xs font-bold uppercase tracking-wider">Masa</th>
                    <th class="px-3.5 py-2.5 text-xs font-bold uppercase tracking-wider">Aktiviti</th>
                    <th class="px-3.5 py-2.5 text-xs font-bold uppercase tracking-wider">Lokasi</th>
                    <th class="px-3.5 py-2.5 text-xs font-bold uppercase tracking-wider">Bandar</th>
                    <th class="px-3.5 py-2.5 text-right text-xs font-bold uppercase tracking-wider">Anggaran (KRW)</th>
                    <th class="px-3.5 py-2.5 text-right text-xs font-bold uppercase tracking-wider">Setara (RM)</th>
                    <th class="px-3.5 py-2.5 text-center text-xs font-bold uppercase tracking-wider">Status</th>
                    <th class="px-3.5 py-2.5 text-xs font-bold uppercase tracking-wider">Tempahan / Nota</th>
                    <th class="px-3.5 py-2.5 text-right text-xs font-bold uppercase tracking-wider">Tindakan</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="animate-in space-y-4">
          ${renderPassportAlert()}
          ${dayCards}
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Jumlah Anggaran Itinerary (KRW)</p>
              <p class="text-xl sm:text-2xl font-extrabold text-brand-600 dark:text-brand-400 mt-0.5">₩${fmtInt(grandKrw)}</p>
            </div>
            <div class="sm:text-right border-t sm:border-t-0 pt-2.5 sm:pt-0 border-slate-100 dark:border-slate-800">
              <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Setara dalam RM (Kadar ${rate})</p>
              <p class="text-lg sm:text-xl font-bold text-emerald-600 dark:text-emerald-400 mt-0.5">RM ${fmtMoney(grandRm)}</p>
            </div>
          </div>
        </div>
      `;
    }

    // ==================== TAB 3: AHLI ====================
    function renderAhliTab() {
      const d = state.data.Ahli;
      if (!d) return '';

      const iNama = idx(d, 'Nama');
      const iTel = idxAny(d, ['No. Telefon', 'Telefon']);
      const iPas = idx(d, 'No. Pasport');
      const iLup = idx(d, 'Tarikh Luput Pasport');
      const iWar = idxAny(d, ['Waris Kecemasan', 'Nama Waris', 'Waris']);
      const iNoW = idx(d, 'No. Waris');
      const iAla = idxAny(d, ['Alahan / Nota Kesihatan', 'Alahan']);

      const rowsHtml = d.rows.map((r) => {
        const nama = iNama >= 0 ? r.cells[iNama] : '';
        const tel = iTel >= 0 ? r.cells[iTel] : '';
        const pas = iPas >= 0 ? r.cells[iPas] : '';
        const lup = iLup >= 0 ? r.cells[iLup] : '';
        const war = iWar >= 0 ? r.cells[iWar] : '';
        const noW = iNoW >= 0 ? r.cells[iNoW] : '';
        const ala = iAla >= 0 ? r.cells[iAla] : '';
        const passBadge = getPassportStatus(lup);

        return `
          <tr class="border-b border-slate-100 dark:border-slate-800/80 hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
            <td class="px-4 py-3.5 whitespace-nowrap">
              <div class="flex items-center gap-2.5">
                <span class="w-8 h-8 rounded-full bg-brand-600 text-white text-xs font-bold flex items-center justify-center shrink-0">
                  ${esc((nama || '?').charAt(0).toUpperCase())}
                </span>
                <span class="font-bold text-slate-900 dark:text-white">${esc(nama)}</span>
              </div>
            </td>
            <td class="px-4 py-3.5 whitespace-nowrap text-slate-700 dark:text-slate-300">
              ${tel ? `<a href="tel:${esc(tel)}" class="hover:underline font-medium">${esc(tel)}</a>` : '<span class="text-slate-400">–</span>'}
            </td>
            <td class="px-4 py-3.5 whitespace-nowrap font-mono font-semibold text-slate-800 dark:text-slate-200">
              ${esc(pas || '–')}
            </td>
            <td class="px-4 py-3.5 whitespace-nowrap">
              <div class="flex items-center gap-2">
                ${lup ? `<span class="text-slate-800 dark:text-slate-200 font-medium">${esc(lup)}</span>` : ''}
                ${passBadge.html}
              </div>
            </td>
            <td class="px-4 py-3.5 whitespace-nowrap text-slate-700 dark:text-slate-300">
              ${war || noW ? `${esc(war)}${noW ? ` <span class="text-xs text-slate-500">(${esc(noW)})</span>` : ''}` : '<span class="text-slate-400">–</span>'}
            </td>
            <td class="px-4 py-3.5 text-xs text-slate-600 dark:text-slate-400 min-w-[180px]">
              ${ala ? `<span class="inline-block px-2 py-0.5 rounded-lg bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-200 border border-amber-200/70 dark:border-amber-800/60">${esc(ala)}</span>` : '<span class="text-slate-400">–</span>'}
            </td>
            <td class="px-4 py-3.5 text-right whitespace-nowrap">
              <button type="button" data-act="edit" data-sheet="Ahli" data-row="${r.row}" class="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Edit">✏️</button>
              <button type="button" data-act="del" data-sheet="Ahli" data-row="${r.row}" class="p-1.5 rounded-lg hover:bg-red-100 dark:hover:bg-red-950 transition" title="Padam">🗑️</button>
            </td>

    // Penentu jenis input borang mengikut nama lajur Sheet
    function getFieldType(sheet, header, keyName) {
      if (sheet === 'Tetapan') {
        if (/^Tarikh/.test(keyName)) return 'date';
        if (/^Kadar/.test(keyName)) return 'number';
        return 'area';
      }
      if (header === 'Fasa') return 'phase';
      if (sheet === 'Checklist' && getMembersList().includes(header)) return 'yn';
      if (header === 'Status') return 'status';
      if (/^Tarikh/.test(header)) return 'date';
      if (header === 'Masa') return 'time';
      if (/\((RM|KRW)\)|^Hari$/.test(header)) return 'number';
      if (/Nota|Link|Alahan/.test(header)) return 'area';
      if (/Telefon|No\. Waris/.test(header)) return 'tel';
      return 'text';
    }

    function openRowModal(sheet, rowNum = null) {
      const d = state.data[sheet];
      if (!d) return;

      const existing = rowNum ? d.rows.find((x) => Number(x.row) === Number(rowNum)) : null;
      const keyName = (sheet === 'Tetapan' && existing) ? existing.cells[idx(d, 'Kunci')] : '';
      const fcols = d.formulaCols || [];
      const fields = sheet === 'Tetapan'
        ? ['Nilai']
        : d.headers.filter((h) => !fcols.includes(h));

      const cats = sheet === 'Checklist'
        ? [...new Set(d.rows.map((r) => r.cells[idx(d, 'Kategori')]).filter(Boolean))]
        : [];

      const rate = getActiveRate();

      const fieldsHtml = fields.map((h, i) => {
        const colIdx = idx(d, h);
        let val = existing && colIdx >= 0 ? existing.cells[colIdx] : '';
        if (!existing && sheet === 'Checklist' && h === 'Fasa') val = state.activePhase;
        if (!existing && sheet === 'Itinerary' && h === 'Bandar') val = 'Seoul';
        if (!existing && sheet === 'Itinerary' && h === 'Status') val = 'Belum';
        if (!existing && sheet === 'Checklist' && getMembersList().includes(h)) val = 'Belum';

        const type = getFieldType(sheet, h, keyName);
        const inputId = `field_${i}`;
        const lockedBySheet = Boolean(existing && Array.isArray(existing.f) && existing.f.includes(colIdx));
        const disAttr = lockedBySheet ? 'disabled' : '';

        let controlHtml = '';
        if (type === 'phase') {
          controlHtml = `<select id="${inputId}" ${disAttr} class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">${PHASES.map((p) => `<option value="${p}" ${(val || 'Before') === p ? 'selected' : ''}>${p}</option>`).join('')}</select>`;
        } else if (type === 'yn') {
          controlHtml = `<select id="${inputId}" ${disAttr} class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">${YN_OPTIONS.map((o) => `<option value="${o}" ${(val || 'Belum') === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
        } else if (type === 'status') {
          controlHtml = `<select id="${inputId}" ${disAttr} class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">${STATUS_OPTIONS.map((o) => `<option value="${o}" ${(val || 'Belum') === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
        } else if (type === 'date') {
          controlHtml = `<input id="${inputId}" ${disAttr} type="date" value="${toISO(val)}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />`;
        } else if (type === 'time') {
          controlHtml = `<input id="${inputId}" ${disAttr} type="time" value="${esc(val)}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />`;
        } else if (type === 'number') {
          controlHtml = `<input id="${inputId}" ${disAttr} type="number" step="any" value="${esc(val)}" data-header-name="${esc(h)}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold" />`;
        } else if (type === 'area') {
          controlHtml = `<textarea id="${inputId}" ${disAttr} rows="2" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">${esc(val)}</textarea>`;
        } else if (type === 'tel') {
          controlHtml = `<input id="${inputId}" ${disAttr} type="tel" value="${esc(val)}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />`;
        } else {
          controlHtml = `<input id="${inputId}" ${disAttr} type="text" value="${esc(val)}" ${h === 'Kategori' ? 'list="cat-datalist"' : ''} class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />`;
        }

        let extraPreview = '';
        if (sheet === 'Itinerary' && h === 'Anggaran (KRW)') {
          const initRm = ((Number(val) || 0) * rate).toFixed(2);
          extraPreview = `
            <div class="mt-1.5 flex items-center justify-between text-xs bg-emerald-50 dark:bg-emerald-950/50 text-emerald-800 dark:text-emerald-300 px-3 py-1.5 rounded-lg border border-emerald-200/70 dark:border-emerald-800/70">
              <span>Setara (RM) auto (kadar ${rate}):</span>
              <strong id="itin-rm-preview">RM ${initRm}</strong>
            </div>
          `;
        }

        return `
          <div>
            <label for="${inputId}" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
              ${esc(keyName || h)}${lockedBySheet ? ' 🔒 (formula Sheet)' : ''}
            </label>
            ${controlHtml}
            ${extraPreview}
          </div>
        `;
      }).join('');

      state.modalOpen = true;
      $('#modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 animate-in" id="modal-backdrop">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-t-3xl sm:rounded-2xl max-w-lg w-full max-h-[92vh] overflow-y-auto p-5 shadow-2xl">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">
              ${existing ? '✏️ Edit' : '➕ Tambah'} · ${esc(keyName || sheet)}
            </h3>
            <datalist id="cat-datalist">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
            <form id="row-editor-form" class="space-y-3.5">
              ${fieldsHtml}
              <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                <button type="button" id="modal-cancel" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition">Batal</button>
                <button type="submit" id="modal-save-btn" class="px-5 py-2 rounded-xl text-sm font-semibold bg-brand-600 text-white hover:bg-brand-700 transition">Simpan</button>
              </div>
            </form>
          </div>
        </div>
      `;

      const krwInput = document.querySelector('[data-header-name="Anggaran (KRW)"]');
      if (krwInput) {
        krwInput.addEventListener('input', () => {
          const val = parseFloat(krwInput.value) || 0;
          const prev = $('#itin-rm-preview');
          if (prev) prev.textContent = `RM ${(val * getActiveRate()).toFixed(2)}`;
        });
      }

      $('#modal-cancel').onclick = closeModal;
      $('#modal-backdrop').onclick = (e) => { if (e.target.id === 'modal-backdrop') closeModal(); };

      $('#row-editor-form').onsubmit = async (e) => {
        e.preventDefault();
        const values = {};
        fields.forEach((h, i) => {
          const el = $(`#field_${i}`);
          if (!el || el.disabled) return;
          const type = getFieldType(sheet, h, keyName);
          values[h] = type === 'date' ? fromISO(el.value) : el.value.trim();
        });

        // Kemas kini UI serta-merta (Optimistic UI)
        if (existing) {
          d.headers.forEach((h, colIdx) => {
            if (Object.prototype.hasOwnProperty.call(values, h)) {
              existing.cells[colIdx] = values[h];
            }
          });
        } else {
          const maxRowNum = d.rows.reduce((m, r) => Math.max(m, Number(r.row) || 1), 1);
          const newCells = d.headers.map((h) => (Object.prototype.hasOwnProperty.call(values, h) ? values[h] : ''));
          d.rows.push({ row: maxRowNum + 1, cells: newCells, f: [] });
        }

        if (sheet === 'Checklist' && values.Fasa) {
          state.activePhase = values.Fasa;
        }

        saveCachedData();
        closeModal();
        updateConverterRateLabel();
        renderAll();

        await postToSheet(
          { action: 'saveRow', sheet, row: existing ? Number(existing.row) : null, values },
          existing ? 'Dikemas kini ✔' : 'Ditambah ✔'
        );
      };
    }

    // ==================== KEMAS KINI INLINE & PADAM ====================
    async function handleInlineUpdate(sheet, rowNum, header, newValue) {
      const d = state.data[sheet];
      if (!d) return;
      const r = d.rows.find((x) => Number(x.row) === Number(rowNum));
      const c = idx(d, header);
      if (!r || c < 0) return;

      r.cells[c] = newValue;
      saveCachedData();
      renderMainContent();

      await postToSheet(
        { action: 'updateCell', sheet, row: Number(rowNum), header, value: newValue },
        `${header}: ${newValue} ✔`
      );
    }

    function handleDeleteRow(sheet, rowNum) {
      openConfirmModal('Padam Baris Ini?', 'Data ini akan dipadam daripada aplikasi dan Google Sheet anda.', async () => {
        const d = state.data[sheet];
        if (!d) return;
        d.rows = d.rows.filter((x) => Number(x.row) !== Number(rowNum));
        saveCachedData();
        renderAll();

        await postToSheet(
          { action: 'removeRow', sheet, row: Number(rowNum) },
          'Baris dipadam'
        );
      });
    }

    // ==================== EKSPORT (JSON & CSV) & IMPORT ====================
    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportJson() {
      const stamp = new Date().toISOString().slice(0, 10);
      downloadFile(`Korea_Trip_Planner_${stamp}.json`, JSON.stringify(state.data, null, 2), 'application/json');
      showToast('Fail sandaran JSON dimuat turun 📤');
    }

    function exportCsv() {
      const escapeCsv = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
      const sections = ['Checklist', 'Itinerary', 'Ahli', 'Tetapan'].map((name) => {
        const d = state.data[name];
        if (!d) return '';
        const lines = [
          `=== ${name.toUpperCase()} ===`,
          d.headers.map(escapeCsv).join(','),
          ...d.rows.map((r) => r.cells.map(escapeCsv).join(','))
        ];
        return lines.join('\r\n');
      }).filter(Boolean).join('\r\n\r\n');

      const stamp = new Date().toISOString().slice(0, 10);
      downloadFile(`Korea_Trip_Planner_${stamp}.csv`, '\uFEFF' + sections, 'text/csv;charset=utf-8;');
      showToast('Fail CSV berjaya dieksport 📊');
    }

    function handleImportJson(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !parsed.Checklist || !parsed.Tetapan || !parsed.Ahli || !parsed.Itinerary) {
            throw new Error('Format fail tidak sah');
          }
          state.data = parsed;
          saveCachedData();
          updateConverterRateLabel();
          renderAll();
          showToast('Data berjaya diimport! 📥');
        } catch (err) {
          showToast('Ralat: Fail JSON tidak sah');
        }
      };
      reader.readAsText(file);
    }

    // ==================== RENDER UTAMA & EVENT LISTENERS ====================
    function renderMainContent() {
      const main = $('#main-content');
      if (state.activeTab === 'Checklist') main.innerHTML = renderChecklistTab();
      else if (state.activeTab === 'Itinerary') main.innerHTML = renderItineraryTab();
      else if (state.activeTab === 'Ahli') main.innerHTML = renderAhliTab();
      else if (state.activeTab === 'Tetapan') main.innerHTML = renderTetapanTab();
    }

    function renderAll() {
      updateSyncPillUI();
      renderSummaryBanner();
      renderTabs();
      renderMainContent();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      updateConverterRateLabel();
      renderAll(); // Papar data serta-merta dari cache/default tanpa skrin kosong

      // Terus tarik data terkini dari Google Sheet secara automatik apabila halaman dibuka
      fetchFromSheet({ silent: false, showToastOnSuccess: false });

      // Auto-sync setiap 20 saat apabila tab aktif dan tiada modal terbuka
      setInterval(() => {
        if (!document.hidden && !state.modalOpen && state.pendingOps === 0) {
          fetchFromSheet({ silent: true });
        }
      }, POLL_MS);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !state.modalOpen && state.pendingOps === 0) {
          fetchFromSheet({ silent: true });
        }
      });

      // Kawalan Header & Pengira Mata Wang
      $('#btn-theme').onclick = toggleTheme;
      $('#btn-toggle-converter').onclick = () => {
        state.showConverter = !state.showConverter;
        $('#converter-drawer').classList.toggle('hidden', !state.showConverter);
      };
      $('#btn-sync-pill').onclick = () => {
        if (state.syncStatus === 'error') {
          openSyncDiagnosticsModal();
        } else {
          fetchFromSheet({ silent: false, showToastOnSuccess: true });
        }
      };

      $('#inp-krw').addEventListener('input', syncConverterFromKrw);
      $('#inp-rm').addEventListener('input', syncConverterFromRm);
      document.querySelectorAll('.preset-krw').forEach((btn) => {
        btn.onclick = () => {
          $('#inp-krw').value = btn.dataset.krwPreset;
          syncConverterFromKrw();
        };
      });

      // Butang Terapung (+ Tambah)
      $('#fab-add').onclick = () => {
        if (state.activeTab !== 'Tetapan') {
          openRowModal(state.activeTab, null);
        }
      };

      // Delegasi Klik
      document.addEventListener('click', (e) => {
        const tabBtn = e.target.closest('[data-tab-id]');
        if (tabBtn) {
          switchTab(tabBtn.dataset.tabId);
          return;
        }

        const phaseBtn = e.target.closest('[data-phase]');
        if (phaseBtn) {
          state.activePhase = phaseBtn.dataset.phase;
          renderMainContent();
          return;
        }

        const actBtn = e.target.closest('[data-act]');
        if (actBtn) {
          const { act, sheet, row } = actBtn.dataset;
          if (act === 'edit') openRowModal(sheet, Number(row));
          else if (act === 'del') handleDeleteRow(sheet, Number(row));
          return;
        }

        // Kawalan Sambungan Google Sheet dalam tab Tetapan
        if (e.target.closest('#btn-save-test-api')) {
          const inp = $('#inp-api-url');
          const url = inp ? inp.value.trim() : '';
          if (!url) {
            showToast('Sila masukkan URL Web App (/exec)');
            return;
          }
          setCustomScriptUrl(url);
          renderMainContent();
          fetchFromSheet({ silent: false, showToastOnSuccess: true });
          return;
        }

        if (e.target.closest('#btn-reset-default-url')) {
          setCustomScriptUrl(DEFAULT_SCRIPT_URL);
          renderMainContent();
          fetchFromSheet({ silent: false, showToastOnSuccess: true });
          return;
        }

        if (e.target.closest('#btn-copy-codegs')) {
          copyTextToClipboard(APPS_SCRIPT_CODE, 'Kod Code.gs lengkap disalin ke papan keratan! 📋');
          return;
        }

        if (e.target.closest('#btn-export-json')) {
          exportJson();
          return;
        }

        if (e.target.closest('#btn-export-csv')) {
          exportCsv();
          return;
        }
      });

      // Delegasi Perubahan Dropdown Inline & Import JSON
      document.addEventListener('change', (e) => {
        if (e.target.matches('select[data-inline-chk]')) {
          const { row, header } = e.target.dataset;
          handleInlineUpdate('Checklist', Number(row), header, e.target.value);
          return;
        }
        if (e.target.matches('select[data-inline-itin]')) {
          const { row, header } = e.target.dataset;
          handleInlineUpdate('Itinerary', Number(row), header, e.target.value);
          return;
        }
        if (e.target.id === 'inp-import-json') {
          handleImportJson(e.target.files[0]);
          e.target.value = '';
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.modalOpen) {
          closeModal();
        }
      });
    });
  </script>
</body>
</html>
